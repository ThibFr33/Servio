# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # The session is only started when it is read or written (on login).
    session:
        cookie_httponly: true
        cookie_secure: auto
        cookie_samesite: lax
        # Logged out after 2 hours of inactivity.
        gc_maxlifetime: 7200

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
